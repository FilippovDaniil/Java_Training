# \u041E\u0431\u0449\u0438\u0435 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0434\u043B\u044F \u0432\u0441\u0435\u0433\u043E \u043A\u0443\u0440\u0441\u0430
server.port=9999

#M65 Task 6
shop.currency=RUB
shop.tax-rate=20
shop.support-email=help@shop.ru

# \u043A\u043E\u0440\u043D\u0435\u0432\u043E\u0439 \u0443\u0440\u043E\u0432\u0435\u043D\u044C
logging.level.root=INFO
# \u0444\u043E\u0440\u043C\u0430\u0442 \u0441\u0442\u0440\u043E\u043A\u0438
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u043D\u0430\u0440\u0443\u0436\u0443 \u043E\u0442\u043A\u0440\u044B\u0442 \u0442\u043E\u043B\u044C\u043A\u043E /actuator/health \u2014 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u043C \u0431\u043E\u043B\u044C\u0448\u0435:
management.endpoints.web.exposure.include=health,info,metrics
# \u0434\u0435\u0442\u0430\u043B\u0438 health (\u0434\u043B\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438):
management.endpoint.health.show-details=always
# \u043D\u0430\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435 /info:
info.app.name=Shop Service
info.app.version=1.0.0

# Spring Security \u043B\u0435\u0436\u0438\u0442 \u0432 classpath \u043D\u0430 \u0432\u0435\u0441\u044C \u043A\u0443\u0440\u0441 (build.gradle) \u0438 \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E
# \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u0412\u0421\u0415 \u044D\u043D\u0434\u043F\u043E\u0438\u043D\u0442\u044B -> \u0432 \u0443\u0447\u0435\u0431\u043D\u044B\u0445 \u043C\u043E\u0434\u0443\u043B\u044F\u0445 \u0431\u0435\u0437 security \u044D\u0442\u043E \u0434\u0430\u0451\u0442 401 \u043D\u0430 GET/POST.
# \u041E\u0442\u043A\u043B\u044E\u0447\u0430\u0435\u043C \u0430\u0432\u0442\u043E-\u0437\u0430\u0449\u0438\u0442\u0443 \u0433\u043B\u043E\u0431\u0430\u043B\u044C\u043D\u043E. \u041C\u043E\u0434\u0443\u043B\u0438, \u0433\u0434\u0435 security \u0418\u0417\u0423\u0427\u0410\u0415\u0422\u0421\u042F, \u0432\u043A\u043B\u044E\u0447\u0430\u044E\u0442 \u0435\u0451 \u0441\u0430\u043C\u0438
# \u0447\u0435\u0440\u0435\u0437 @EnableWebSecurity + \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0439 SecurityFilterChain \u2014 \u043D\u0430 \u043D\u0438\u0445 \u044D\u0442\u043E \u043D\u0435 \u0432\u043B\u0438\u044F\u0435\u0442.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
